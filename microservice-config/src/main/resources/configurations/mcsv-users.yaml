server:
  port: 0

spring:
  application:
    name: mcsv-users

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/k-and-l_health/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://localhost:5431/mcsv_usersdb
    username: postgres
    password: Estudent1!
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

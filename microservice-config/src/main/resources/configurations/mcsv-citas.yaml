server:
  port: 0

spring:
  application:
    name: mcsv-citas

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/k-and-l_health/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://localhost:5432/mcsv_citasdb
    username: postgres
    password: Estudent1!
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false # Apagado para evitar duplicados en System.out
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.web: TRACE
    # Loggers específicos para ver SQL estructurado y parámetros '?'
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
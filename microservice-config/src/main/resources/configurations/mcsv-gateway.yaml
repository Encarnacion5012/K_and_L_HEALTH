server:
  port: 8080


spring:
  application:
    name: mcsv-gateway
  threats:
    virtual:
      enabled: true


  cloud:

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:

          #Rutas de servicio de usuarios
          #RUtas de usuarios
            - id: users-routes
              uri: lb://mcsv-users
              predicates:
                - Path=/api/users/**
              filters:
                - SaveSession
                - TokenRelay

            #RUtas de pacientes
            - id: pacientes-routes
              uri: lb://mcsv-users
              predicates:
                - Path=/api/pacientes/**
              filters:
                - SaveSession
                - TokenRelay
              #RUtas de doctores
            - id: doctores-routes
              uri: lb://mcsv-users
              predicates:
                - Path=/api/doctor/**
              filters:
                - SaveSession
                - TokenRelay

            #RUtas de especialidades
            - id: especialidad-routes
              uri: lb://mcsv-users
              predicates:
                - Path=/api/especialidad/**
              filters:
                - SaveSession
                - TokenRelay
            #Rutas de citas
            - id: cita-routes
              uri: lb://mcsv-citas
              predicates:
                - Path=/api/citas/**
              filters:
                - SaveSession
                - TokenRelay

            # Rutas de swagger para documentación
          # Users
            - id: openapi-users
              uri: lb://mcsv-users
              predicates:
               - Path=/v3/api-docs/mcsv-users
              filters:
               - RewritePath=/v3/api-docs/mcsv-users, /v3/api-docs

          # Citas
            - id: openapi-citas
              uri: lb://mcsv-citas
              predicates:
                - Path=/v3/api-docs/mcsv-citas
              filters:
                - RewritePath=/v3/api-docs/mcsv-citas, /v3/api-docs

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8181/realms/k-and-l_health
        registration:
          keycloak:
            provider: keycloak
            client-id: k-and-l_health_microservices
            client-secret: "UyoWXBD7eVB6dzZVa3HuP8hSTHNuENNWxETbktNkeqglIoG37yT3UhVAyr3mEI9uDrLW1XovxVIHOQTpWb6GSf"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope:
              - openid
              - profile
              - email
              - roles

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    with-credentials: true
    disable-swagger-default-url: true
    urls:
      - name: Microservicio Usuarios
        url: /v3/api-docs/mcsv-users
      - name: Microservicio Citas
        url: /v3/api-docs/mcsv-citas

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.web: TRACE
services:
  db-users:
    image: postgres:17-alpine
    container_name: db-users
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcsv_usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Estudent1!
    ports:
      - "5431:5432"
    expose:
      - 5431
    volumes:
      - postgre_mcsv_users_data:/var/lib/postgresql/data

  db-citas:
    image: postgres:17-alpine
    container_name: db-citas
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcsv_citasdb
      POSTGRES_PASSWORD: Estudent1!
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      -  postgre_mcsv_citas_data:/var/lib/postgresql/data

  db-factura:
    image: postgres:17-alpine
    container_name: db-factura
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcsv_facturadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Estudent1!
    ports:
      - "5433:5432"
    expose:
      - 5433
    volumes:
      -  postgre_mcsv_factura_data:/var/lib/postgresql/data


  db-historial-clinico:
    image: postgres:17-alpine
    container_name: db-historial-clinico
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcsv_historial_clinico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Estudent1!
    ports:
      - "5434:5432"
    expose:
      - 5434
    volumes:
      - postgre_mcsv_historial_clinico_data:/var/lib/postgresql/data

  db-keycloak:
    image: postgres:17-alpine
    container_name: db-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: db-keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Estudent1!
    ports:
      - "5435:5432"
    expose:
      - 5435
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    command: [ "start-dev" ]
    depends_on:
      - db-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: db-keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: Estudent1!
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8181:8080"
    expose:
      - 8181


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_gui
    environment:
      PGADMIN_DEFAULT_EMAIL: estainlinv@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - 5050


volumes:
  postgre_mcsv_users_data:
    driver: local
  postgre_mcsv_citas_data:
    driver: local
  postgre_mcsv_factura_data:
    driver: local
  postgre_mcsv_historial_clinico_data:
    driver: local
  keycloak_data:
    driver: local
  pgadmin_data:
    driver: local
